# Claude builds approved change requests as a branch for Stephen to review.
#
# How it is switched on
#   1. Install the Claude GitHub App on this repository, https://github.com/apps/claude
#   2. Add the repository secret ANTHROPIC_API_KEY under Settings, Secrets and variables, Actions
# Until the secret exists, this workflow starts and then stops without doing anything.
#
# Who can trigger it
#   Only people with write access, which is Stephen. Students can open issues and comment,
#   but they cannot add labels, and the action rejects @claude from anyone without write access.
#   So no student request spends API credit until Stephen approves it.
#
# How Stephen uses it
#   Add the label build-this to a change request, or comment @claude with instructions on an issue or pull request.

name: Claude builds approved changes

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'build-this') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check the API key is set
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set, so Claude is switched off. Nothing to do."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.key.outputs.on == 'true'
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: steps.key.outputs.on == 'true'
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.on == 'true'
        with:
          python-version: '3.12'

      - name: Install the browser test tools
        if: steps.key.outputs.on == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.on == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: build-this
          track_progress: true
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node tests/check_engine.mjs),Bash(python3 build_offline.py),Bash(python3 build_offline.py --check),Bash(python3 tests/smoke.py),Bash(python tests/smoke.py),Bash(sha256sum:*),Bash(git status),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git switch:*),Bash(git log:*),Bash(ls:*),Bash(date:*),Bash(sed:*)"
